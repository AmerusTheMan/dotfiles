[theme]
mode              = "dark"        # dark | light | auto
source            = "wallpaper"     # builtin | wallpaper | community | custom
builtin           = "Noctalia"    # bundled palette name
community_palette = "Oxocarbon"   # community palette name when source = "community"
custom_palette    = "MyPalette"   # file name (without .json) when source = "custom"
wallpaper_scheme  = "vibrant"     # generator used when source = "wallpaper"
pure_black_dark   = false         # replace dark-mode backgrounds with pure black


[theme.templates]
enable_builtin_templates = true
builtin_ids = [ "alacritty", "btop", "cava", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "qt" ]

enable_community_templates = true
community_ids = [ "zen-browser" ]
