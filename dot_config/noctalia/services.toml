[audio]
enable_overdrive     = false  # allow volume sliders above 100% (up to 150%)
enable_sounds        = true   # master toggle for UI sounds
sound_volume         = 0.5    # global sound volume (0.0 - 1.0)



[battery]
warning_threshold = 10 # 0 disables low-battery warnings

[battery.device."/org/freedesktop/UPower/devices/battery_BAT0"]
warning_threshold = 15

[battery.device."/org/freedesktop/UPower/devices/headset_dev_00_11_22_33_44_55"]
warning_threshold = 10


[brightness]
enable_ddcutil     = false
ignore_mmids       = []     # e.g. ["ACI-ROG_PG279Q-10220"] - skip in all ddcutil commands
minimum_brightness = 0.0    # never let brightness drop below this floor (0.0 to 1.0)
sync_all_monitors = false   # if set to true, makes every display have the same brightness

[brightness.monitor.eDP-1]
backend = "backlight"   # auto | none | backlight | ddcutil
backlight_device = "intel_backlight"   # explicit sysfs device name or path

[brightness.monitor.DP-1]
backend = "ddcutil"


[idle]
# Canonical evaluation order for named behaviors. Names not listed are appended.
behavior_order = ["lock", "screen-off", "suspend"]
# Seconds to fade a fullscreen surface-tint overlay, then run the idle command.
# 0 disables the overlay (the command runs as soon as the compositor reports idle).
# Parsed between 0 and 120; the in-app Settings stepper uses whole seconds 0–30.
pre_action_fade_seconds = 5.0

[idle.behavior.lock]
timeout = 300
action = "lock"
enabled = true             # explicitly disabled in the default config

[idle.behavior.screen-off]
timeout = 600
action = "screen_off"       # turns monitors off, and back on when you return
enabled = true             # explicitly disabled in the default config

[idle.behavior.suspend]
timeout = 900
action = "lock_and_suspend" # or action = "suspend" with lock_before_suspend = false


[nightlight]
enabled             = false
force               = false   # hold night temperature, ignoring the schedule

temperature_day     = 6500       # Kelvin (must be > temperature_night by at least 100)
temperature_night   = 4000       # Kelvin


[notification]
enable_daemon            = true        # when false, don't claim org.freedesktop.Notifications; internal toasts still work
show_app_name            = true        # show the sending application name in toasts
show_actions             = true        # show action buttons; when false, clicking a toast triggers its default action
position                 = "top_right" # top_right | top_left | top_center | bottom_right | bottom_left | bottom_center
layer                    = "top"       # top | overlay; overlay appears above fullscreen apps
scale                    = 1.0         # toast size multiplier on top of shell.ui_scale
background_opacity       = 0.97        # toast card background alpha; lower values let compositor blur show through
border                   = true        # outline around toast cards; set false for a borderless look
offset_x                 = 20          # absolute horizontal margin from the screen edge
offset_y                 = 8           # absolute vertical margin from the screen edge
monitors                 = []          # empty = all monitors; otherwise connector/description selectors (e.g. ["eDP-1", "DP-1"])
collapse_on_dismiss      = true        # slide remaining toasts to close gaps when one is dismissed
# history_retention_hours  = 12           # delete stored history older than this; 0 keeps it indefinitely


[system.monitor]
enabled = true                      # sample CPU, memory, network, load, temperature, GPU VRAM, and disk statistics
cpu_temp_sensor_path = ""           # exact temp*_input path for CPU temperature override; empty = auto
cpu_poll_seconds = 2.0              # CPU usage, CPU temperature, and load average
gpu_poll_seconds = 5.0              # GPU temperature, usage, and VRAM; probes run only while displayed
memory_poll_seconds = 2.0           # RAM usage
network_poll_seconds = 3.0          # network throughput
disk_poll_seconds = 10.0            # disk usage and swap usage
